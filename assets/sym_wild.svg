<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="w-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffcc" />
      <stop offset="30%" stop-color="#ffbb00" />
      <stop offset="70%" stop-color="#ff3300" />
      <stop offset="100%" stop-color="#4a0600" />
    </radialGradient>
    <filter id="wglow"><feGaussianBlur stdDeviation="4" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="16" fill="#1a0602" stroke="#ffbb00" stroke-width="3" />
  <!-- Sunburst Rays -->
  <circle cx="60" cy="60" r="42" fill="url(#w-sun)" filter="url(#wglow)" />
  <polygon points="60,14 66,32 54,32" fill="#ffee77" filter="url(#wglow)" />
  <polygon points="60,106 66,88 54,88" fill="#ffee77" filter="url(#wglow)" />
  <polygon points="14,60 32,66 32,54" fill="#ffee77" filter="url(#wglow)" />
  <polygon points="106,60 88,66 88,54" fill="#ffee77" filter="url(#wglow)" />
  <!-- Wild Text -->
  <text x="60" y="68" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" stroke="#801000" stroke-width="2" filter="url(#wglow)" letter-spacing="2">WILD</text>
</svg>