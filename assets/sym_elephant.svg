<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="el-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#421a08" />
      <stop offset="100%" stop-color="#140702" />
    </radialGradient>
    <linearGradient id="el-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b3" />
      <stop offset="50%" stop-color="#ffbb00" />
      <stop offset="100%" stop-color="#994400" />
    </linearGradient>
    <filter id="el-glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  </defs>
  <!-- Stone Tile -->
  <rect x="4" y="4" width="92" height="92" rx="14" fill="url(#el-bg)" stroke="#ffaa00" stroke-width="3" />
  <rect x="8" y="8" width="84" height="84" rx="10" fill="none" stroke="#803300" stroke-width="1.5" />

  <!-- Ears Left & Right -->
  <path d="M32,32 C12,18 4,36 8,56 C12,72 26,70 34,58 Z" fill="#542510" stroke="#ff6600" stroke-width="2" />
  <path d="M68,32 C88,18 96,36 92,56 C88,72 74,70 66,58 Z" fill="#542510" stroke="#ff6600" stroke-width="2" />

  <!-- Head Dome -->
  <path d="M32,24 Q50,12 68,24 Q78,42 72,62 Q50,68 28,62 Q22,42 32,24 Z" fill="#3d1a0b" stroke="#ff7700" stroke-width="2.5" />

  <!-- Crown Jewel -->
  <polygon points="50,16 56,24 50,30 44,24" fill="#ffee55" stroke="#fff" stroke-width="1" filter="url(#el-glow)" />

  <!-- Glowing Amber Eyes -->
  <ellipse cx="40" cy="38" rx="6" ry="4" fill="#110401" />
  <ellipse cx="40" cy="38" rx="4" ry="2.5" fill="#ffcc00" filter="url(#el-glow)" />
  <circle cx="40" cy="38" r="1.5" fill="#ffffff" />

  <ellipse cx="60" cy="38" rx="6" ry="4" fill="#110401" />
  <ellipse cx="60" cy="38" rx="4" ry="2.5" fill="#ffcc00" filter="url(#el-glow)" />
  <circle cx="60" cy="38" r="1.5" fill="#ffffff" />

  <!-- Golden Curved Tusks -->
  <path d="M34,54 C20,64 16,84 32,92 C28,78 34,66 40,58 Z" fill="url(#el-gold)" stroke="#ffe680" stroke-width="1.5" filter="url(#el-glow)" />
  <path d="M66,54 C80,64 84,84 68,92 C72,78 66,66 60,58 Z" fill="url(#el-gold)" stroke="#ffe680" stroke-width="1.5" filter="url(#el-glow)" />

  <!-- Trunk with Ridges -->
  <path d="M44,52 Q42,78 45,90 Q50,96 55,90 Q58,78 56,52 Z" fill="#4a200d" stroke="#ff6600" stroke-width="2" />
  <line x1="45" y1="62" x2="55" y2="62" stroke="#ffaa00" stroke-width="1.5" />
  <line x1="46" y1="72" x2="54" y2="72" stroke="#ffaa00" stroke-width="1.5" />
  <line x1="47" y1="82" x2="53" y2="82" stroke="#ffaa00" stroke-width="1.5" />
</svg>