<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="r-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#361805" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>
    <linearGradient id="magma-horn" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991100" />
      <stop offset="50%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#ffff99" />
    </linearGradient>
    <filter id="rglow"><feGaussianBlur stdDeviation="5" result="b" /><feComposite in="SourceGraphic" in2="b" operator="over" /></filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="16" fill="url(#r-bg)" stroke="#cc4400" stroke-width="4" />
  <circle cx="200" cy="145" r="90" fill="#ff5500" opacity="0.2" filter="url(#rglow)" />

  <!-- Heavy Armored Head -->
  <path d="M120,110 Q200,75 280,110 L290,190 Q200,270 110,190 Z" fill="#402416" stroke="#ff7700" stroke-width="4" />
  <!-- Armored Plates -->
  <path d="M135,130 L265,130 L255,170 L145,170 Z" fill="#261309" stroke="#a64b15" stroke-width="2" />

  <!-- Fiery Eyes -->
  <ellipse cx="150" cy="145" rx="10" ry="6" fill="#ffff00" filter="url(#rglow)" />
  <ellipse cx="250" cy="145" rx="10" ry="6" fill="#ffff00" filter="url(#rglow)" />

  <!-- Giant Glowing Magma Horn -->
  <path d="M180,240 Q170,140 200,60 Q230,140 220,240 Z" fill="url(#magma-horn)" stroke="#ffdd66" stroke-width="2.5" filter="url(#rglow)" />
  <path d="M188,230 Q185,180 200,120 Q215,180 212,230 Z" fill="#fff" opacity="0.6" filter="url(#rglow)" />

  <rect x="110" y="15" width="180" height="32" rx="16" fill="#1a0802" stroke="#ff5500" stroke-width="2" />
  <text x="200" y="36" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#ff9944" text-anchor="middle" letter-spacing="2">TITAN RHINO</text>
</svg>