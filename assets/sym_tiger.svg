<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="ti-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#471a03" />
      <stop offset="100%" stop-color="#120501" />
    </radialGradient>
    <linearGradient id="ti-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="60%" stop-color="#d45500" />
      <stop offset="100%" stop-color="#802000" />
    </linearGradient>
    <filter id="ti-glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="14" fill="url(#ti-bg)" stroke="#ff7700" stroke-width="3" />
  <rect x="8" y="8" width="84" height="84" rx="10" fill="none" stroke="#802800" stroke-width="1.5" />

  <!-- Ears with White Inner Tuft -->
  <polygon points="22,14 36,32 16,38" fill="#993300" stroke="#ff7700" stroke-width="2" />
  <polygon points="24,20 32,30 20,34" fill="#fff" />
  <polygon points="78,14 84,38 64,32" fill="#993300" stroke="#ff7700" stroke-width="2" />
  <polygon points="76,20 80,34 68,30" fill="#fff" />

  <!-- Tiger Face Shape -->
  <path d="M26,34 Q50,18 74,34 Q90,56 82,78 Q50,94 18,78 Q10,56 26,34 Z" fill="url(#ti-fur)" stroke="#ffaa00" stroke-width="2.5" />

  <!-- Forehead Stripes -->
  <path d="M50,22 L50,34 M42,26 L46,36 M58,26 L54,36" stroke="#140501" stroke-width="3" stroke-linecap="round" />
  <!-- Cheek Stripes -->
  <path d="M22,50 L34,54 M20,62 L32,64 M78,50 L66,54 M80,62 L68,64" stroke="#140501" stroke-width="2.5" stroke-linecap="round" />

  <!-- Glowing Yellow Eyes -->
  <ellipse cx="36" cy="46" rx="7" ry="5" fill="#140501" />
  <ellipse cx="36" cy="46" rx="5" ry="3" fill="#ffee33" filter="url(#ti-glow)" />
  <ellipse cx="64" cy="46" rx="7" ry="5" fill="#140501" />
  <ellipse cx="64" cy="46" rx="5" ry="3" fill="#ffee33" filter="url(#ti-glow)" />

  <!-- White Snout -->
  <ellipse cx="50" cy="66" rx="18" ry="12" fill="#fff2e6" stroke="#b33600" stroke-width="1.5" />
  <!-- Black Nose -->
  <polygon points="45,58 55,58 50,65" fill="#140501" />
  <!-- Mouth and Fangs -->
  <path d="M40,70 Q50,78 60,70" stroke="#801400" stroke-width="2.5" fill="none" />
  <polygon points="42,70 45,78 48,70" fill="#fff" />
  <polygon points="58,70 55,78 52,70" fill="#fff" />
</svg>