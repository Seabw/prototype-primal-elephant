<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="pti-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#661a00" />
    </radialGradient>
    <filter id="pti-glow"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#pti-bg)" stroke="#ffe680" stroke-width="2.5" filter="url(#pti-glow)" />
  <circle cx="50" cy="50" r="38" fill="#1a0601" stroke="#ff5500" stroke-width="1.5" />

  <!-- Tiger Face Mini -->
  <polygon points="26,20 38,34 22,38" fill="#993300" stroke="#ff7700" />
  <polygon points="74,20 78,38 62,34" fill="#993300" stroke="#ff7700" />
  <path d="M30,34 Q50,22 70,34 Q82,50 74,68 Q50,78 26,68 Q18,50 30,34 Z" fill="#ff8800" stroke="#ffbb00" stroke-width="1.5" />
  <!-- Stripes -->
  <line x1="50" y1="24" x2="50" y2="34" stroke="#140501" stroke-width="2" />
  <line x1="26" y1="46" x2="34" y2="50" stroke="#140501" stroke-width="2" />
  <line x1="74" y1="46" x2="66" y2="50" stroke="#140501" stroke-width="2" />
  <!-- Eyes -->
  <circle cx="40" cy="44" r="3" fill="#ffee33" />
  <circle cx="60" cy="44" r="3" fill="#ffee33" />
  <!-- Fangs -->
  <polygon points="42,62 44,68 46,62" fill="#fff" />
  <polygon points="58,62 56,68 54,62" fill="#fff" />

  <!-- Label Badge -->
  <rect x="12" y="75" width="76" height="16" rx="8" fill="#120501" stroke="#ffaa00" stroke-width="1.5" />
  <text x="50" y="87" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#ffdd88" text-anchor="middle" letter-spacing="0.5">APEX SPINS</text>
</svg>