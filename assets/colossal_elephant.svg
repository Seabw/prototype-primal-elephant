<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4a1505" stop-opacity="1" />
      <stop offset="60%" stop-color="#1f0a03" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d0401" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="gold-tusk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7d1" />
      <stop offset="40%" stop-color="#ffbb00" />
      <stop offset="100%" stop-color="#d45d00" />
    </linearGradient>
    <linearGradient id="fire-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9c4e20" />
      <stop offset="50%" stop-color="#5a260d" />
      <stop offset="100%" stop-color="#2e1005" />
    </linearGradient>
    <linearGradient id="magma-vein" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3300" />
      <stop offset="50%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#ff3300" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Volcanic Stone Plaque Base -->
  <rect x="8" y="8" width="384" height="284" rx="16" fill="url(#bg-glow)" stroke="#e67300" stroke-width="4" />
  <rect x="16" y="16" width="368" height="268" rx="12" fill="none" stroke="#803300" stroke-width="2" stroke-dasharray="12 6" />

  <!-- Fire Aura Behind Beast -->
  <circle cx="200" cy="145" r="105" fill="#ff4400" opacity="0.25" filter="url(#glow)" />
  <circle cx="200" cy="145" r="70" fill="#ffaa00" opacity="0.3" filter="url(#glow)" />

  <!-- Elephant Ears -->
  <path d="M130,130 C80,80 40,110 50,180 C60,230 110,220 135,190 Z" fill="url(#fire-skin)" stroke="#ff6600" stroke-width="3" />
  <path d="M270,130 C320,80 360,110 350,180 C340,230 290,220 265,190 Z" fill="url(#fire-skin)" stroke="#ff6600" stroke-width="3" />

  <!-- Inner Ear Magma Veins -->
  <path d="M80,140 Q65,175 95,195" stroke="url(#magma-vein)" stroke-width="3" fill="none" filter="url(#glow)" />
  <path d="M320,140 Q335,175 305,195" stroke="url(#magma-vein)" stroke-width="3" fill="none" filter="url(#glow)" />

  <!-- Elephant Massive Head -->
  <path d="M140,90 Q200,60 260,90 Q275,150 250,195 Q200,210 150,195 Q125,150 140,90 Z" fill="url(#fire-skin)" stroke="#ff7700" stroke-width="4" />

  <!-- Carved Stone Brow & Crown -->
  <path d="M160,85 L200,105 L240,85 L200,70 Z" fill="#ffaa00" stroke="#fff" stroke-width="1.5" filter="url(#glow)" />

  <!-- Glowing Fiery Eyes -->
  <ellipse cx="170" cy="135" rx="14" ry="8" fill="#1a0500" />
  <ellipse cx="170" cy="135" rx="11" ry="6" fill="#ffcc00" filter="url(#glow)" />
  <ellipse cx="170" cy="135" rx="4" ry="4" fill="#ffffff" />

  <ellipse cx="230" cy="135" rx="14" ry="8" fill="#1a0500" />
  <ellipse cx="230" cy="135" rx="11" ry="6" fill="#ffcc00" filter="url(#glow)" />
  <ellipse cx="230" cy="135" rx="4" ry="4" fill="#ffffff" />

  <!-- Massive Golden Curved Tusks -->
  <path d="M145,180 C110,210 90,265 145,280 C130,250 145,210 160,190 Z" fill="url(#gold-tusk)" stroke="#ffe680" stroke-width="2" filter="url(#glow)" />
  <path d="M255,180 C290,210 310,265 255,280 C270,250 255,210 240,190 Z" fill="url(#gold-tusk)" stroke="#ffe680" stroke-width="2" filter="url(#glow)" />

  <!-- Trunk with Volcanic Ridges -->
  <path d="M180,175 Q180,240 185,275 Q200,285 215,275 Q220,240 220,175 Z" fill="url(#fire-skin)" stroke="#ff6600" stroke-width="3" />
  <line x1="183" y1="195" x2="217" y2="195" stroke="url(#magma-vein)" stroke-width="2.5" filter="url(#glow)" />
  <line x1="184" y1="220" x2="216" y2="220" stroke="url(#magma-vein)" stroke-width="2.5" filter="url(#glow)" />
  <line x1="185" y1="245" x2="215" y2="245" stroke="url(#magma-vein)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Badge Name Plate -->
  <rect x="110" y="15" width="180" height="32" rx="16" fill="#1a0802" stroke="#ffaa00" stroke-width="2" />
  <text x="200" y="36" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#ffdd88" text-anchor="middle" letter-spacing="2">COLOSSAL TITAN</text>
</svg>